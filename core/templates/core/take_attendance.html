{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 p-4 shadow rounded bg-white">
    <h2 class="text-center mb-4 text-primary">Take Attendance</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="subject" class="form-label fw-bold">Select Subject:</label>
            <select name="subject" id="subject" class="form-select" required>
                <option value="">-- Select Subject --</option>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Roll Number</th>
                        <th scope="col">Name</th>
                        <th scope="col">Attendance Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.roll_number }}</td>
                        <td>{{ student.name }}</td>
                        <td>
                            <select name="status_{{ student.id }}" class="form-select" required>
                                <option value="present">Present</option>
                                <option value="absent">Absent</option>
                                <option value="late">Late</option>
                                <option value="excused">Excused</option>
                            </select>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-muted">No students found in this department.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4 py-2 fw-bold shadow">Submit Attendance</button>
        </div>
    </form>
</div>
{% endblock %}
