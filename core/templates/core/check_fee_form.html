<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Your Fee Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Global styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Form container */
        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-container label {
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .form-container input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 4px;
            margin-top: 20px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-container button:hover {
            background-color: #0056b3;
        }

        /* Responsive styling */
        @media (max-width: 576px) {
            .form-container {
                padding: 20px;
            }

            .form-container button {
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <h1>Enter Your Roll Number to Check Your Fee Status</h1>
    
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            <label for="roll_number">Roll Number:</label>
            <input type="text" name="roll_number" id="roll_number" required>
            <button type="submit">Check Fee Status</button>
        </form>
    </div>

</body>
</html>
