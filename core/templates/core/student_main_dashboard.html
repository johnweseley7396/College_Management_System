<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Management System | Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            padding: 10px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #007bff;
        }

        .card-box {
            padding: 20px;
            color: white;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .bg-blue {
            background-color: #00c0ef;
        }

        .bg-green {
            background-color: #00a65a;
        }

        .bg-yellow {
            background-color: #f39c12;
        }

        .bg-red {
            background-color: #dd4b39;
        }

        .chart-box {
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            height: 250px;
            color: white;
        }

        .chart-blue {
            background-color: #00c0ef;
        }

        .chart-green {
            background-color: #00a65a;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div class="sidebar">
            <a href="#">Home</a>
            <a href="#">View Attendance</a>
            <a href="#">View Result</a>
            <a href="#">Apply for Leave</a>
            <a href="#">Send Feedback</a>
        </div>
        <div class="container-fluid p-4">
            <h3>Student Home</h3>
            <div class="row">
                <div class="col-md-3">
                    <div class="card-box bg-blue">
                        <h5>Total Attendance</h5>
                        <p>More info <i class="fas fa-arrow-circle-right"></i></p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-box bg-green">
                        <h5>Absent</h5>
                        <p>More info <i class="fas fa-arrow-circle-right"></i></p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-box bg-yellow">
                        <h5>Present</h5>
                        <p>More info <i class="fas fa-arrow-circle-right"></i></p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-box bg-red">
                        <h5>Total Subjects</h5>
                        <p>More info <i class="fas fa-arrow-circle-right"></i></p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="chart-box chart-blue">
                        <h5>Total Attendance Chart</h5>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="chart-box chart-green">
                        <h5>Attendance Statistics by Subjects</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
