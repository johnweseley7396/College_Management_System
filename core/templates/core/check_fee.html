<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 30px;
        }

        .table {
            margin-top: 20px;
        }

        .btn-back {
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Acharya Nagarjuna University Fee Details</h1>
    <h2>Fee Status for {{ student.name }}</h2>
    <p>Roll Number: {{ student.roll_number }}</p>
    
    <h3>Fee Payment Status</h3>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Due Amount (₹)</th>
                <th>Amount Paid (₹)</th>
                <th>Total Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>₹{{ fee_status.due_amount }}</td>
                <td>₹{{ fee_status.amount_paid }}</td>
                <td>₹{{ fee_status.total_amount }}</td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn-back">Back to Home</a>

</body>
</html>
