<!DOCTYPE html>
<html>
<head>
    <title>Pay Fee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .table th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Fee Payment Portal</h2>

    <div class="card p-4">
        <h4 class="mb-3 text-primary">Student Fee Details</h4>
        <table class="table table-bordered">
            <tbody>
                <tr>
                    <th>Student Name</th>
                    <td>{{ fee.student.name }}</td>
                </tr>
                <tr>
                    <th>Roll Number</th>
                    <td>{{ fee.student.roll_number }}</td>
                </tr>
                <tr>
                    <th>Total Amount</th>
                    <td>₹ {{ fee.total_amount }}</td>
                </tr>
                <tr>
                    <th>Due Amount</th>
                    <td>₹ {{ fee.due_amount }}</td>
                </tr>
            </tbody>
        </table>

        <form method="POST" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="amount_paid" class="form-label"><strong>Amount You Want to Pay (₹):</strong></label>
                <input type="number" min="1" max="{{ fee.due_amount }}" name="amount_paid" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Pay Now</button>
        </form>
    </div>
</div>
</body>
</html>
