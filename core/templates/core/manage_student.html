<!-- core/templates/core/manage_student.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manage Students</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; }
        th { background-color: #f4f4f4; }
        a.button { padding: 6px 12px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
        a.button:hover { background: #45a049; }
        .actions a { margin: 0 5px; }
        .container { width: 90%; margin: auto; }
        h1 { text-align: center; margin-top: 30px; }
        .add-btn { display: block; width: 100px; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manage Students</h1>
        <a href="{% url 'add_student' %}" class="button add-btn">Add Student</a>

        {% if students %}
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.id }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.email }}</td>
                        <td>{{ student.phone }}</td>
                        <td class="actions">
                            <a href="{% url 'edit_student' student.id %}">Edit</a>
                            <a href="{% url 'delete_student' student.id %}">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No students found.</p>
        {% endif %}
    </div>
</body>
</html>
