{% extends 'base.html' %}
{% block content %}
<h2>Manage Subjects</h2>

<a href="{% url 'add_subject' %}" class="btn btn-primary mb-3">Add Subject</a>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Subject Name</th>
      <th>Subject Code</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for subject in subjects %}
    <tr>
      <td>{{ subject.id }}</td>
      <td>{{ subject.name }}</td>
      <td>{{ subject.code }}</td>
      <td>
        <a href="{% url 'edit_subject' subject.id %}" class="btn btn-warning btn-sm">Edit</a>
        <a href="{% url 'delete_subject' subject.id %}" class="btn btn-danger btn-sm">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No subjects found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
