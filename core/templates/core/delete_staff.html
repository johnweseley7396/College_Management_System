{% extends 'base.html' %}
{% block content %}
<h1>Delete Staff</h1>

<p>Are you sure you want to delete {{ staff.first_name }} {{ staff.last_name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'manage_staff' %}">Cancel</a>
</form>
{% endblock %}
